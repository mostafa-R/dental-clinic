<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dental OS - Site Dashboard</title>
    <script>
      // Pre-paint theme + language restore. Wrapped in try/catch: when
      // storage access is blocked (strict privacy modes, embedded iframes)
      // `window.localStorage` itself throws, and an unwrapped failure would
      // abort this inline script (mirrors Client/index.html).
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark") document.documentElement.classList.add("dark");
          var lang = localStorage.getItem("language");
          if (lang === "ar") { document.documentElement.dir = "rtl"; document.documentElement.lang = "ar"; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
