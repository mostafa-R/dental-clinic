          description: Invoice updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      invoice:
                        $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot edit a void invoice or financial fields of a paid invoice
  /api/v1/billing/{id}/payments:
    post:
      tags:
        - Billing
      summary: Record a payment
      description: >-
        Requires `billing:update`. Deduplicated via the `x-idempotency-key` header. Wallet payments debit the patient
        wallet and a fully-paid invoice accrues the doctor commission atomically.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: header
          name: x-idempotency-key
          schema:
            type: string
          description: Optional key that makes the request idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - method
              properties:
                amount:
                  type: number
                  minimum: 0.01
                method:
                  type: string
                  enum:
                    - cash
                    - card
                    - transfer
                    - wallet
                reference:
                  type: string
                  maxLength: 200
                date:
                  type: string
                  format: date-time
                notes:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Payment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      invoice:
                        $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invoice already fully paid, or payment on a void invoice
  /api/v1/billing/{id}/refund:
    post:
      tags:
        - Billing
      summary: Refund a payment
      description: >-
        Requires `billing.delete` or `accounting.update` (PRD §6.6 — reception alone cannot refund). Records a negative
        payment. Wallet refunds credit the patient wallet; commissions are adjusted proportionally. Deduplicated via
        `x-idempotency-key`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: header
          name: x-idempotency-key
          schema:
            type: string
          description: Optional key that makes the request idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  minimum: 0.01
                method:
                  type: string
                  enum:
                    - cash
                    - card
                    - transfer
                    - wallet
                reference:
                  type: string
                  maxLength: 200
                date:
                  type: string
                  format: date-time
                notes:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Payment refunded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      invoice:
                        $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot refund a void invoice
