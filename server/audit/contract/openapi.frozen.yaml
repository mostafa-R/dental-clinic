      responses:
        '201':
          description: Consent created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/patients/{patientId}/consents/{consentId}:
    get:
      tags:
        - Consents
      summary: Get a consent
      description: Requires `consents:read`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: consentId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Consent details
    patch:
      tags:
        - Consents
      summary: Update a draft/sent consent
      description: Requires `consents:update`. Frozen once signed — return 409.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: consentId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Consent updated
        '409':
          description: Signed/declined/withdrawn consent is immutable
    delete:
      tags:
        - Consents
      summary: Delete (soft) a draft/sent consent
      description: Requires `consents:delete`. Signed records cannot be deleted — withdraw instead.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: consentId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Consent deleted
  /api/v1/patients/{patientId}/consents/{consentId}/sign:
    post:
      tags:
        - Consents
      summary: Sign a consent (electronic signature)
      description: Requires `consents:update`. Stores an HMAC signature hash and freezes the record.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: consentId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signature
              properties:
                signature:
                  type: object
                  required:
                    - method
                    - name
                  properties:
                    method:
                      type: string
                      enum:
                        - typed
                        - drawn
                        - otp
                        - staff_photo
                        - patient_photo
                    name:
                      type: string
                      maxLength: 120
                    phone:
                      type: string
                    imageUrl:
                      type: string
                patientStatement:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Consent signed
  /api/v1/patients/{patientId}/consents/{consentId}/decline:
    post:
      tags:
        - Consents
      summary: Decline a consent
      description: Requires `consents:update`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: consentId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Consent declined
  /api/v1/patients/{patientId}/consents/{consentId}/withdraw:
    post:
      tags:
        - Consents
      summary: Withdraw a signed consent (patient revokes)
      description: Requires `consents:update`. The record is preserved for audit.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: consentId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Consent withdrawn
  /api/v1/patients/{patientId}/consents/{consentId}/verify:
    get:
      tags:
        - Consents
      summary: Verify a signature hash (tamper-evidence)
      description: Requires `consents:read`. Recomputes and compares the stored HMAC.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: consentId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Verification result
  /api/v1/patients/{patientId}/clinical-notes:
    get:
      tags:
        - Clinical Notes
