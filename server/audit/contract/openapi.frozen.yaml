paths:
  /api/v1/whatsapp/settings:
    get:
      tags:
        - WhatsApp
      summary: Get WhatsApp settings
      description: Requires `settings:read`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current WhatsApp settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      settings:
                        type: object
                        properties:
                          provider:
                            type: string
                            enum:
                              - whatsapp_web
                              - cloud_api
                          enabled:
                            type: boolean
                          config:
                            type: object
                          settings:
                            type: object
                            properties:
                              appointmentReminder:
                                type: boolean
                              appointmentConfirm:
                                type: boolean
                              reminderHours:
                                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - WhatsApp
      summary: Update WhatsApp settings
      description: Requires `settings:update`. Switching the provider triggers re-initialization of the client.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                    - whatsapp_web
                    - cloud_api
                enabled:
                  type: boolean
                config:
                  type: object
                settings:
                  type: object
                  properties:
                    appointmentReminder:
                      type: boolean
                    appointmentConfirm:
                      type: boolean
                    reminderHours:
                      type: integer
                      minimum: 1
                      maximum: 168
      responses:
        '200':
          description: WhatsApp settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      settings:
                        type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/whatsapp/connect:
    post:
      tags:
        - WhatsApp
      summary: Connect WhatsApp
      description: >-
        Requires `settings:update`. Starts the WhatsApp client connection (pairing for whatsapp_web, credential
        validation for cloud_api).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Connection initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - connecting
                          - connected
                      provider:
                        type: string
                        enum:
                          - whatsapp_web
                          - cloud_api
                      ready:
                        type: boolean
                        description: 'Only set for whatsapp_web: whether the client finished pairing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/whatsapp/qr:
    get:
      tags:
        - WhatsApp
      summary: Get current QR code
      description: Requires `settings:read`. Returns the pending pairing QR code if available.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current QR code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      qrCode:
                        type: string
                        nullable: true
                        description: Pairing QR data URL (whatsapp_web only)
                      status:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/whatsapp/disconnect:
    post:
      tags:
        - WhatsApp
      summary: Disconnect WhatsApp
      description: Requires `settings:update`. Disconnects the current WhatsApp client.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/whatsapp/status:
    get:
      tags:
        - WhatsApp
      summary: Get WhatsApp connection status
      description: Requires `settings:read`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      connected:
                        type: boolean
                      provider:
                        type: string
                      status:
                        type: string
                      phoneNumber:
                        type: string
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/whatsapp/test:
    post:
      tags:
        - WhatsApp
      summary: Send a test message
      description: Requires `settings:update`. Sends a test WhatsApp message to the given number.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - message
              properties:
                to:
                  type: string
                  description: Phone number (E.164 or local format, e.g. +201234567890 or 01012345678).
                  pattern: ^\+?\d{7,15}(@c\.us)?$
                message:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Test message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
