      summary: Create an appointment
      description: >-
        Requires `appointments:create`. Validates the patient/doctor references, clinic working hours, doctor
        availability, and prevents double-booking (doctor and patient).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient
                - doctor
              properties:
                patient:
                  $ref: '#/components/schemas/ObjectId'
                doctor:
                  $ref: '#/components/schemas/ObjectId'
                branch:
                  $ref: '#/components/schemas/ObjectId'
                chair:
                  type: string
                  maxLength: 60
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum:
                    - scheduled
                    - confirmed
                  default: scheduled
                reason:
                  type: string
                  maxLength: 300
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      appointment:
                        $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Doctor or patient already has an overlapping appointment, or the doctor is unavailable
