components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT access token sent in the `Authorization` header. Used by site (platform) admins via `Authorization: Bearer
        <token>`. Impersonation tokens issued by `/site/impersonation/start` are also bearer JWTs.
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >-
        Clinic staff JWT access token, stored in the HTTP-only `access_token` cookie set by `POST /auth/login`. Required
        for all clinic routes.
    siteCookieAuth:
      type: apiKey
      in: cookie
      name: site_access
      description: >-
        Site admin JWT access token, stored in the HTTP-only `site_access` cookie set by `POST /site/auth/login`.
        Alternative to the Bearer header.
  parameters:
    TenantIdHeader:
      name: x-tenant-id
      in: header
      required: false
      description: >-
        Tenant (clinic) ObjectId used to scope a request to a specific tenant. Required for platform admins operating
        across multiple tenants.
      schema:
        type: string
    PaginationPage:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    PaginationLimit:
      name: limit
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Unauthorized:
      description: Not authenticated - missing or invalid credentials.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum:
                  - false
              message:
                type: string
    Forbidden:
      description: Authenticated but lacking the required permission/role.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum:
                  - false
              message:
                type: string
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum:
                  - false
              message:
                type: string
    ValidationError:
      description: Request validation failed. The `details` object maps each invalid field to an array of error messages.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum:
                  - false
              message:
                type: string
              details:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                enum:
                  - false
              message:
                type: string
  schemas:
    ApiResponseEnvelope:
      type: object
      description: Standard success envelope. `data` shape varies per endpoint.
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
        total:
          type: integer
          example: 120
        pages:
          type: integer
          example: 3
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      example: 60f7b1c2d3e4f5a6b7c8d9e0
    DateTime:
      type: string
      format: date-time
    User:
      type: object
      description: Clinic staff member.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tenant:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 30
        roleId:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/Role'
        branch:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/Branch'
          nullable: true
        isDoctor:
          type: boolean
          default: false
        isActive:
          type: boolean
          default: true
        commissionRate:
          type: number
          minimum: 0
          maximum: 100
          default: 0
        lastLogin:
          type: string
          format: date-time
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    PermissionEntry:
      type: object
      properties:
        module:
          type: string
          enum:
            - dashboard
            - patients
            - appointments
            - billing
            - accounting
            - inventory
            - emr
            - prescriptions
            - users
            - branches
            - settings
            - roles
            - chat
        actions:
          type: array
          items:
            type: string
            enum:
              - create
              - read
              - update
              - delete
    Role:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tenant:
          $ref: '#/components/schemas/ObjectId'
        branch:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 300
        key:
          type: string
        isSystemAdmin:
          type: boolean
          default: false
        isBuiltIn:
          type: boolean
          default: false
        isActive:
          type: boolean
          default: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionEntry'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    Branch:
      type: object
      description: Clinic branch.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tenant:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 30
        isActive:
          type: boolean
          default: true
        slotDuration:
          type: integer
          minimum: 5
          maximum: 120
          default: 30
        bufferTime:
          type: integer
          minimum: 0
          maximum: 60
          default: 0
        breakStart:
          type: string
          example: '13:00'
          nullable: true
        breakEnd:
          type: string
          example: '14:00'
          nullable: true
        workingHours:
          type: object
          additionalProperties:
            type: object
            properties:
              open:
                type: string
                example: '09:00'
                nullable: true
              close:
                type: string
                example: '17:00'
                nullable: true
              closed:
                type: boolean
                default: false
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    Patient:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        patientId:
          type: string
          example: PT-00001
        tenant:
          $ref: '#/components/schemas/ObjectId'
        branch:
          $ref: '#/components/schemas/ObjectId'
        firstName:
          type: string
          maxLength: 60
        lastName:
          type: string
          maxLength: 60
        fullName:
          type: string
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
        gender:
          type: string
          enum:
            - male
            - female
            - other
            - unknown
        address:
          type: string
          maxLength: 500
        medicalHistory:
          $ref: '#/components/schemas/MedicalHistory'
        isActive:
          type: boolean
          default: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    MedicalHistory:
      type: object
      properties:
        chronicConditions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 120
              notes:
                type: string
                maxLength: 500
        allergies:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                maxLength: 120
              notes:
                type: string
                maxLength: 500
        notes:
          type: string
          maxLength: 2000
    Wallet:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tenant:
          $ref: '#/components/schemas/ObjectId'
        branch:
          $ref: '#/components/schemas/ObjectId'
        patient:
          $ref: '#/components/schemas/ObjectId'
        balance:
          type: number
          minimum: 0
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    WalletTransaction:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        type:
          type: string
          enum:
            - credit
            - debit
        amount:
          type: number
          minimum: 0.01
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        reference:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 300
        invoice:
          $ref: '#/components/schemas/ObjectId'
        installment:
          $ref: '#/components/schemas/ObjectId'
        createdBy:
          $ref: '#/components/schemas/ObjectId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
    InstallmentPlan:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tenant:
          $ref: '#/components/schemas/ObjectId'
        branch:
          $ref: '#/components/schemas/ObjectId'
        patient:
          $ref: '#/components/schemas/ObjectId'
        invoice:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
          maxLength: 200
        totalAmount:
          type: number
          minimum: 0.01
        paidAmount:
          type: number
          minimum: 0
        installments:
          type: array
          items:
            $ref: '#/components/schemas/Installment'
        frequency:
          type: string
          enum:
            - weekly
            - biweekly
            - monthly
            - custom
          default: monthly
        status:
          type: string
          enum:
            - active
            - completed
            - defaulted
        notes:
          type: string
          maxLength: 1000
        balance:
          type: number
        progress:
          type: number
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    Installment:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        number:
          type: integer
        dueDate:
          $ref: '#/components/schemas/DateTime'
        amount:
          type: number
          minimum: 0.01
        paidAmount:
          type: number
          minimum: 0
        paidDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - pending
            - paid
            - overdue
        paymentMethod:
          type: string
          nullable: true
        paymentRef:
          type: string
        notes:
          type: string
          maxLength: 300
    Appointment:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tenant:
          $ref: '#/components/schemas/ObjectId'
        patient:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: object
              properties:
                _id:
                  $ref: '#/components/schemas/ObjectId'
                patientId:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
        doctor:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/User'
        branch:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/Branch'
        chair:
          type: string
          maxLength: 60
        start:
          type: string
          format: date-time
          nullable: true
        end:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - scheduled
            - confirmed
            - checked_in
            - in_progress
            - completed
            - cancelled
            - no_show
        reason:
          type: string
          maxLength: 300
        notes:
          type: string
          maxLength: 1000
        durationMin:
          type: integer
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    Invoice:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        invoiceNo:
          type: string
          example: INV-00001
        tenant:
          $ref: '#/components/schemas/ObjectId'
        patient:
          $ref: '#/components/schemas/ObjectId'
        branch:
          $ref: '#/components/schemas/ObjectId'
        appointment:
          $ref: '#/components/schemas/ObjectId'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        subtotal:
          type: number
        discountType:
          type: string
          enum:
            - fixed
            - percentage
          default: fixed
        discountRate:
          type: number
          minimum: 0
          maximum: 100
        discount:
          type: number
        taxRate:
          type: number
          minimum: 0
          maximum: 100
        tax:
          type: number
        total:
          type: number
        paidAmount:
          type: number
        balance:
          type: number
        status:
          type: string
          enum:
            - unpaid
            - partial
            - paid
            - void
        dueDate:
          type: string
          format: date-time
          nullable: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePayment'
        notes:
          type: string
          maxLength: 1000
        createdBy:
          $ref: '#/components/schemas/ObjectId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    InvoiceItem:
      type: object
      properties:
        description:
          type: string
          maxLength: 200
        quantity:
          type: number
          minimum: 1
        unitPrice:
          type: number
          minimum: 0
        discount:
          type: number
          minimum: 0
        tax:
          type: number
          minimum: 0
        total:
          type: number
        paidAmount:
          type: number
    InvoicePayment:
      type: object
      properties:
        amount:
          type: number
        method:
          type: string
          enum:
            - cash
            - card
            - transfer
            - wallet
        reference:
          type: string
          maxLength: 200
        idempotencyKey:
          type: string
        date:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 300
        recordedBy:
          $ref: '#/components/schemas/ObjectId'
        isRefund:
          type: boolean
          default: false
    Expense:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        category:
          type: string
          enum:
            - salary
            - rent
            - utilities
            - supplies
            - maintenance
            - marketing
            - other
        description:
          type: string
          maxLength: 300
        amount:
          type: number
          minimum: 0.01
        date:
          $ref: '#/components/schemas/DateTime'
        paymentMethod:
          type: string
          enum:
            - cash
            - bank
            - card
        branch:
          $ref: '#/components/schemas/ObjectId'
        createdBy:
          $ref: '#/components/schemas/ObjectId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
    OwnerDrawing:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        owner:
          $ref: '#/components/schemas/ObjectId'
        amount:
          type: number
          minimum: 0.01
        paymentMethod:
          type: string
          enum:
            - cash
            - bank
            - card
            - wallet
        patient:
          $ref: '#/components/schemas/ObjectId'
        description:
          type: string
          maxLength: 300
        date:
          $ref: '#/components/schemas/DateTime'
        branch:
          $ref: '#/components/schemas/ObjectId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
    Commission:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        doctor:
          $ref: '#/components/schemas/ObjectId'
        invoice:
          $ref: '#/components/schemas/ObjectId'
        amount:
          type: number
          minimum: 0.01
        status:
          type: string
          enum:
            - pending
            - paid
            - void
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
    AccountingSummary:
      type: object
      description: Aggregated accounting totals for a date range.
      additionalProperties: true
    InventoryItem:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tenant:
          $ref: '#/components/schemas/ObjectId'
        branch:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          maxLength: 120
        sku:
          type: string
          maxLength: 60
        category:
          type: string
          enum:
            - anesthetic
            - filling_material
            - consumable
            - instrument
            - medication
            - hygiene
            - other
        unit:
          type: string
          enum:
            - unit
            - box
            - pack
            - bottle
            - tube
            - set
            - ml
            - g
        quantity:
          type: number
          minimum: 0
        reorderPoint:
          type: number
          minimum: 0
        costPerUnit:
          type: number
          minimum: 0
        expiryDate:
          type: string
          format: date-time
          nullable: true
        supplier:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 500
        isActive:
          type: boolean
          default: true
        needsReorder:
          type: boolean
        isExpired:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    StockTransaction:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        type:
          type: string
          enum:
            - stock_in
            - stock_out
            - adjustment
            - expired
            - initial
        quantity:
          type: number
        reason:
          type: string
          maxLength: 200
        reference:
          type: string
          maxLength: 200
        date:
          $ref: '#/components/schemas/DateTime'
        recordedBy:
          $ref: '#/components/schemas/ObjectId'
    TreatmentPlan:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        planNo:
          type: string
          example: TP-00001
        tenant:
          $ref: '#/components/schemas/ObjectId'
        branch:
          $ref: '#/components/schemas/ObjectId'
        patient:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
          maxLength: 120
        diagnosis:
          type: string
          maxLength: 1000
        status:
          type: string
          enum:
            - active
            - completed
            - archived
        items:
          type: array
          items:
            $ref: '#/components/schemas/TreatmentPlanItem'
        nextAppointment:
          type: string
          format: date-time
          nullable: true
        nextAppointmentNotes:
          type: string
          maxLength: 500
        nextAppointmentCreated:
          $ref: '#/components/schemas/ObjectId'
        totalEstimated:
          type: number
        totalCompleted:
          type: number
        progress:
          type: number
        createdBy:
          $ref: '#/components/schemas/ObjectId'
        updatedBy:
          $ref: '#/components/schemas/ObjectId'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    TreatmentPlanItem:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tooth:
          type: integer
          minimum: 1
          maximum: 32
          nullable: true
        surfaces:
          type: array
          items:
            type: string
            enum:
              - mesial
              - distal
              - buccal
              - lingual
              - occlusal
        procedureCode:
          type: string
          maxLength: 32
        procedureName:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        estimatedCost:
          type: number
          minimum: 0
        status:
          type: string
          enum:
            - pending
            - in_progress
            - completed
            - cancelled
        completedDate:
          type: string
          format: date-time
          nullable: true
        appointment:
          $ref: '#/components/schemas/ObjectId'
        invoice:
          $ref: '#/components/schemas/ObjectId'
        notes:
          type: string
          maxLength: 500
    Prescription:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        rxNo:
