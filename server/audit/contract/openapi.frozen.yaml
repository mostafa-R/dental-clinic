  /api/v1/patients/{patientId}/installments/{planId}/pay:
    post:
      tags:
        - Installment Plans
      summary: Pay an installment
      description: >-
        Requires `billing:update` or `installments:update`. Executed in a transaction to prevent double-payment races.
        Wallet payments debit the patient wallet. Pass `x-idempotency-key` to dedupe a retry on the linked invoice
        ledger. Defaulted plans are resumed to `active` on payment.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: path
          name: planId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: header
          name: x-idempotency-key
          schema:
            type: string
          description: Optional key that makes the linked invoice payment idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - installmentId
                - amount
              properties:
                installmentId:
                  $ref: '#/components/schemas/ObjectId'
                amount:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                paymentMethod:
                  type: string
                  enum:
                    - cash
                    - card
                    - transfer
                    - wallet
                paymentRef:
                  type: string
                  maxLength: 100
                notes:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Installment paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      installmentPlan:
                        $ref: '#/components/schemas/InstallmentPlan'
                      installment:
                        $ref: '#/components/schemas/Installment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
