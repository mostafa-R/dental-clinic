          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Billing
      summary: Create an invoice
      description: >-
        Requires `billing:create`. Pre-validates the patient and appointment (if given), then creates the invoice and
        its number inside a transaction. Invoice totals are computed from the line items.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient
                - items
              properties:
                patient:
                  $ref: '#/components/schemas/ObjectId'
                branch:
                  $ref: '#/components/schemas/ObjectId'
                appointment:
                  $ref: '#/components/schemas/ObjectId'
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - description
                      - quantity
                      - unitPrice
                    properties:
                      description:
                        type: string
                        maxLength: 200
                      quantity:
                        type: number
                        minimum: 1
                      unitPrice:
                        type: number
                        minimum: 0
                      discount:
                        type: number
                        minimum: 0
                      tax:
                        type: number
                        minimum: 0
                discount:
                  type: number
                  minimum: 0
                discountType:
                  type: string
                  enum:
                    - fixed
                    - percentage
                  default: fixed
                discountRate:
                  type: number
                  minimum: 0
                  maximum: 100
                tax:
                  type: number
                  minimum: 0
                taxRate:
                  type: number
                  minimum: 0
                  maximum: 100
                dueDate:
                  type: string
                  format: date-time
                notes:
                  type: string
                  maxLength: 1000
      responses:
