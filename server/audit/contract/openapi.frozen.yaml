  - name: Branches
    description: Clinic branches
  - name: Patients
    description: Patient records (PHI)
  - name: Wallets
    description: Patient wallets
  - name: Installment Plans
    description: Patient installment plans
  - name: Appointments
    description: Appointments and scheduling
  - name: Billing
    description: Invoices, payments and refunds
  - name: Accounting
    description: Expenses, drawings and commissions
  - name: Inventory
