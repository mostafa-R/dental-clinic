    get:
      tags:
        - Installment Plans
      summary: List a patient's installment plans
      description: Requires `billing:read` or `installments:read`.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - completed
              - defaulted
        - $ref: '#/components/parameters/PaginationPage'
        - $ref: '#/components/parameters/PaginationLimit'
      responses:
        '200':
          description: Paginated list of installment plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      installmentPlans:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstallmentPlan'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Installment Plans
      summary: Create an installment plan
      description: >-
        Requires `billing:create` or `installments:create`. The sum of installments must equal `totalAmount`. Only one
        active plan per invoice, and the plan total cannot exceed the invoice's outstanding balance.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: patientId
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - totalAmount
                - installments
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                totalAmount:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                installments:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required:
                      - dueDate
                      - amount
                    properties:
                      dueDate:
                        type: string
                        format: date-time
                      amount:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                frequency:
                  type: string
                  enum:
                    - weekly
                    - biweekly
                    - monthly
                    - custom
                invoice:
                  $ref: '#/components/schemas/ObjectId'
                notes:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Installment plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      installmentPlan:
                        $ref: '#/components/schemas/InstallmentPlan'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
