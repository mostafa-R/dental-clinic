openapi: 3.0.0
info:
  title: Dental OS API
  version: 1.0.0
  description: >-
    Multi-tenant SaaS dental clinic management API.


    Two authentication realms exist:


    1. **Clinic (staff) realm** - `/api/v1/*` routes. Authenticated via the HTTP-only `access_token` cookie set by
    `/auth/login`. Authorization is enforced per module with `checkPermission(module, action)`.


    2. **Site (platform) realm** - `/api/v1/site/*` routes. Authenticated via the `Authorization: Bearer <jwt>` header
    OR the HTTP-only `site_access` cookie. Role-based access (`super_admin`, `admin`, `support`) and 2FA enforcement for
    sensitive operations apply.


    All successful responses share the envelope `{ success: true, data }`, with `meta`/`pagination` where applicable.
    Errors use `{ success: false, message, details }`.
servers:
  - url: http://localhost:7000
    description: Development server
tags:
