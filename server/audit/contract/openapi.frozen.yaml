    post:
      tags:
        - Accounting
      summary: Close the day (BR-BL-04)
      description: >
        Requires `accounting:update` (clinic manager/accountant). Snapshots the expected takings, records the counted
        cash with the resulting difference as an immutable audit record, and notifies the branch over the socket.
        Re-closing a closed day returns 409.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - countedCash
              properties:
                date:
                  type: string
                  description: Defaults to today
                branch:
                  $ref: '#/components/schemas/ObjectId'
                countedCash:
                  type: number
                  minimum: 0
                notes:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Day closed
        '409':
          description: Already closed
