      tags:
        - Appointments
      summary: Call the next waiting patient to a chair
      description: >
        Requires `appointments:update`. Atomically claims the earliest waiting (checked_in) appointment of the day and
        moves it to in_progress, emitting `queue.patient.called` on the branch room and the tenant `queue:{tenantId}`
        room. Pass `doctor` to call per-doctor queues.
      security:
        - cookieAuth: []
