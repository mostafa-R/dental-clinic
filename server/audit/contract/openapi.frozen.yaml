                    properties:
                      invoice:
                        $ref: '#/components/schemas/Invoice'
        '400':
          description: Invalid invoice id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Billing
      summary: Update an invoice
      description: >-
        Requires `billing:update`. Financial fields (items/discount/tax) cannot be modified on a paid invoice, and void
        invoices cannot be edited.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - description
                      - quantity
                      - unitPrice
                    properties:
                      description:
                        type: string
                        maxLength: 200
                      quantity:
                        type: number
                        minimum: 1
                      unitPrice:
                        type: number
                        minimum: 0
                      discount:
                        type: number
                        minimum: 0
                      tax:
                        type: number
                        minimum: 0
                discount:
                  type: number
                  minimum: 0
                discountType:
                  type: string
                  enum:
                    - fixed
                    - percentage
                discountRate:
                  type: number
                  minimum: 0
                  maximum: 100
                tax:
                  type: number
                  minimum: 0
                taxRate:
                  type: number
                  minimum: 0
                  maximum: 100
                dueDate:
                  type: string
                  format: date-time
                notes:
                  type: string
                  maxLength: 1000
      responses:
