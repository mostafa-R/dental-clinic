                  minimum: 1
                  maximum: 100000
                defaultPlan:
                  type: string
                  enum:
                    - starter
                    - professional
                    - enterprise
                trialDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                backupEnabled:
                  type: boolean
                backupRetentionDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                backupTime:
                  type: string
